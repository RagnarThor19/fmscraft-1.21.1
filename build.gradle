plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

configurations {
	serverMods
}

// In-game tests (Fabric game tests) live in their own source set so they never ship in the mod jar
sourceSets {
	gametest {
		compileClasspath += main.compileClasspath + main.output
		runtimeClasspath += main.runtimeClasspath + main.output
	}
}

loom {
	mods {
		fmscraft {
			sourceSet sourceSets.main
		}
		"fmscraft-gametest" {
			sourceSet sourceSets.gametest
		}
	}

	runs {
		// gradlew runGametest: starts a server, runs every game test, exits non-zero on failure
		gametest {
			inherit server
			name "Game Test"
			vmArg "-Dfabric-api.gametest"
			vmArg "-Dfabric-api.gametest.report-file=${layout.buildDirectory.get().asFile}/gametest/junit.xml"
			runDir "build/gametest"
			source sourceSets.gametest
		}
	}
}

fabricApi {
	configureDataGeneration {
		client = true
		// Only run this mod's generators; the companion mods are loaded too and would write into src/main/generated
		modId = "fmscraft"
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Companion mods: loaded in runClient/runServer so all three are always tested together.
	// Only referenced by id from code, so they aren't on the compile classpath.
	[project.twilight_mod_jar, project.magic_mod_jar].each { path ->
		def jar = file(path)
		if (jar.exists()) {
			modLocalRuntime files(jar)
		} else {
			logger.warn("Companion mod not found, dev runs will start without it: ${jar}")
		}
	}

	testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"

	serverMods("net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}") { transitive = false }
}

// Collects everything the server's mods folder needs into build/server-mods:
// this mod, the twilight and magic mods, and Fabric API. Players need the same jars in their own mods folder.
// Every game test run starts from a fresh world, so nothing saved by an earlier run can leak into the results
afterEvaluate {
	tasks.named('runGametest') {
		doFirst {
			delete layout.buildDirectory.dir('gametest/world')
		}
	}
}

tasks.register('prepareServer', Sync) {
	group = 'fmscraft'
	description = 'Copies all server mod jars into build/server-mods'
	from remapJar
	from configurations.serverMods
	from(project.twilight_mod_jar)
	from(project.magic_mod_jar)
	into layout.buildDirectory.dir('server-mods')
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

test {
	useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
