# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=1.21.1
yarn_mappings=1.21.1+build.3
loader_version=0.19.3
loom_version=1.17-SNAPSHOT

# Mod Properties
version=1.0.0
group=net.ragnar.fmscraft

# Dependencies
fabric_api_version=0.116.15+1.21.1

# Companion mods, loaded together with this one in dev runs (runClient/runServer) and copied by prepareServer.
# Paths are relative to this project. Rebuild those projects (gradlew build) to pick up their changes.
twilight_mod_jar=../Fabric-Twilight-1.21.1/build/libs/ragnarstwilightdimension-1.0.0.jar
magic_mod_jar=../ragnars-magic-mod-1.21.1/build/libs/ragnarsmagicmod-1.1.0.jar
